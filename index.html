<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Mohamed El Shenawy</h1> <!-- اسمك بالانجليزي -->
        <div class="nav-bar">
            <span>Mohamed El Shenawy - ID: 225114246</span> <!-- اسمك و الـ ID بتاعك -->
            <div class="links">
                <a href="#cards">Skills</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </header>

    <main>
        <!-- زر الدارك مود المطور -->
        <button id="theme-btn" class="theme-toggle-btn" aria-label="Toggle Dark Mode">
            🌙
        </button>

        <!-- الصورة الشخصية -->
        <section class="profile-photo">
            <img src="images/me.jpg" alt="Mohamed El Shenawy photo">
        </section>

        <!-- البطاقات الثلاث -->
        <div class="cards-row" id="cards">
            <div class="card">
                <h3>Skills</h3>
                <p>HTML, CSS, JavaScript, C#</p>
            </div>
            <div class="card">
                <h3>Hobbies</h3>
                <p>Gym, Reading, Riding Motorcycles</p>
            </div>
            <div class="card">
                <h3>Projects</h3>
                <p>Bank Account Management System, Profile Page</p>
            </div>
        </div>

        <!-- نموذج التواصل -->
        <section id="contact" class="contact-section">
            <h2>Get in Touch</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
